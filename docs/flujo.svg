<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Publicador de redes con IA · la IA redacta, una persona aprueba</title><desc id="d">Automatizar del todo no sirve: publicar sin revisar, en nombre de una organización que trabaja con menores, es inaceptable. Las cifras salen de data/*.csv, que produce la simulación.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="52" font-size="29" font-weight="700" fill="#0f172a" text-anchor="start">Publicador de redes con IA · la IA redacta, una persona aprueba</text><text x="48" y="82" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Automatizar del todo no sirve: publicar sin revisar, en nombre de una organización que trabaja con menores, es</text><text x="48" y="102" font-size="14" font-weight="400" fill="#475569" text-anchor="start">inaceptable. Las cifras salen de data/*.csv, que produce la simulación.</text><rect x="60" y="150" width="360" height="900" rx="18" fill="#e2e8f0" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="76" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">ENTRADA</text><text x="76" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Lo que ya se planifica</text><rect x="460" y="150" width="360" height="900" rx="18" fill="#ede9fe" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="476" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">REDACCIÓN</text><text x="476" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Un borrador por red</text><rect x="860" y="150" width="340" height="900" rx="18" fill="#fee2e2" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="876" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">CRITERIO HUMANO</text><text x="876" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">El paso que no se salta</text><rect x="1240" y="150" width="340" height="900" rx="18" fill="#dbeafe" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="1256" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">PUBLICACIÓN</text><text x="1256" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Cuando toca y donde toca</text><rect x="1620" y="150" width="320" height="900" rx="18" fill="#dcfce7" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="1636" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">VALOR</text><text x="1636" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Qué gana el equipo</text><path d="M 400 330 H 440.0 V 330 H 480" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="440.0" y="320" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">cada día 08:00</text><path d="M 800 330 H 840.0 V 400 H 880" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="840.0" y="320" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">36 borradores</text><path d="M 1180 360 H 1220.0 V 330 H 1260" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1220.0" y="320" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">aprobado</text><path d="M 1180 460 H 1220.0 V 640 H 1260" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="1220.0" y="450" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">rechazado</text><path d="M 1560 330 H 1600.0 V 300 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 1560 640 H 1600.0 V 540 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 1560 860 H 1600.0 V 780 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 1390 940 V 1010 H 210 V 800" fill="none" stroke="#0891b2" stroke-width="2.2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="800.0" y="1002" font-size="11.5" font-weight="600" fill="#0891b2" text-anchor="middle">las métricas vuelven al calendario: qué tipo de post funciona</text><rect x="80" y="250" width="320" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="96" y="262" width="69.6" height="20" rx="10" fill="#e2e8f0"/><text x="130.8" y="276" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">YA EXISTE</text><text x="96" y="304" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Calendario de contenido</text><text x="96" y="329" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Lo que el equipo ya planifica en una</text><text x="96" y="345" font-size="11" font-weight="400" fill="#475569" text-anchor="start">hoja: talleres, testimonios, tips.</text><text x="96" y="361" font-size="11" font-weight="400" fill="#475569" text-anchor="start">No hay herramienta nueva que</text><text x="96" y="377" font-size="11" font-weight="400" fill="#475569" text-anchor="start">aprender.</text><line x1="96" y1="385" x2="384" y2="385" stroke="#e2e8f0" stroke-width="1.5"/><text x="96" y="401" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">contenidos programados</text><text x="384" y="401" font-size="12" font-weight="700" fill="#334155" text-anchor="end">14</text><rect x="80" y="620" width="320" height="180" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="96" y="632" width="50.400000000000006" height="20" rx="10" fill="#dbeafe"/><text x="121.2" y="646" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">EN GIT</text><text x="96" y="674" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Plantillas de prompt versionadas</text><text x="96" y="699" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Una por tipo de contenido, en</text><text x="96" y="715" font-size="11" font-weight="400" fill="#475569" text-anchor="start">prompts/. Cambiar el tono es</text><text x="96" y="731" font-size="11" font-weight="400" fill="#475569" text-anchor="start">editar un archivo de texto, no</text><text x="96" y="747" font-size="11" font-weight="400" fill="#475569" text-anchor="start">tocar el flujo.</text><line x1="96" y1="755" x2="384" y2="755" stroke="#e2e8f0" stroke-width="1.5"/><text x="96" y="771" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">tipos de contenido</text><text x="384" y="771" font-size="12" font-weight="700" fill="#1e40af" text-anchor="end">3</text><rect x="480" y="240" width="320" height="250" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="496" y="252" width="24.8" height="20" rx="10" fill="#ede9fe"/><text x="508.4" y="266" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">IA</text><text x="496" y="294" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Claude redacta por red</text><text x="496" y="319" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Cada red tiene su largo, su tono y</text><text x="496" y="335" font-size="11" font-weight="400" fill="#475569" text-anchor="start">sus hashtags. Un mismo taller no se</text><text x="496" y="351" font-size="11" font-weight="400" fill="#475569" text-anchor="start">cuenta igual en LinkedIn que en</text><text x="496" y="367" font-size="11" font-weight="400" fill="#475569" text-anchor="start">TikTok.</text><line x1="496" y1="375" x2="784" y2="375" stroke="#e2e8f0" stroke-width="1.5"/><text x="496" y="391" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">redes distintas</text><text x="784" y="391" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="end">4</text><text x="496" y="410" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">borradores generados</text><text x="784" y="410" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="end">36</text><text x="496" y="429" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">por contenido</text><text x="784" y="429" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="end">2.6</text><rect x="480" y="570" width="320" height="225" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="496" y="582" width="76.0" height="20" rx="10" fill="#dcfce7"/><text x="534.0" y="596" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">AUTOMÁTICO</text><text x="496" y="624" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Validación antes de la cola</text><text x="496" y="649" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Largo por red, hashtags, enlaces.</text><text x="496" y="665" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Un borrador que no cumple no llega</text><text x="496" y="681" font-size="11" font-weight="400" fill="#475569" text-anchor="start">a molestar a una persona: se</text><text x="496" y="697" font-size="11" font-weight="400" fill="#475569" text-anchor="start">descarta antes.</text><line x1="496" y1="705" x2="784" y2="705" stroke="#e2e8f0" stroke-width="1.5"/><text x="496" y="721" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">si la IA no está</text><text x="784" y="721" font-size="12" font-weight="700" fill="#166534" text-anchor="end">plantillas</text><text x="496" y="740" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">el flujo</text><text x="784" y="740" font-size="12" font-weight="700" fill="#166534" text-anchor="end">no se cae</text><rect x="880" y="300" width="300" height="300" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="896" y="312" width="82.4" height="20" rx="10" fill="#fee2e2"/><text x="937.2" y="326" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">OBLIGATORIO</text><text x="896" y="354" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Una persona aprueba, edita o</text><text x="896" y="373" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">rechaza</text><text x="896" y="398" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Nada sale al aire sin que alguien lo</text><text x="896" y="414" font-size="11" font-weight="400" fill="#475569" text-anchor="start">mire. No es un paso opcional que se</text><text x="896" y="430" font-size="11" font-weight="400" fill="#475569" text-anchor="start">pueda saltar con prisa: sin</text><text x="896" y="446" font-size="11" font-weight="400" fill="#475569" text-anchor="start">aprobación no hay publicación.</text><text x="896" y="462" font-size="11" font-weight="400" fill="#475569" text-anchor="start"></text><text x="896" y="478" font-size="11" font-weight="400" fill="#475569" text-anchor="start">El rechazo guarda el motivo, y eso</text><text x="896" y="494" font-size="11" font-weight="400" fill="#475569" text-anchor="start">es lo que mejora los prompts.</text><line x1="896" y1="502" x2="1164" y2="502" stroke="#e2e8f0" stroke-width="1.5"/><text x="896" y="518" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">aprobados directo</text><text x="1164" y="518" font-size="12" font-weight="700" fill="#166534" text-anchor="end">27  (75 %)</text><text x="896" y="537" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">editados y aprobados</text><text x="1164" y="537" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">5  (13 %)</text><text x="896" y="556" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">rechazados</text><text x="1164" y="556" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">4  (11 %)</text><rect x="1260" y="250" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="276" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Publica en su fecha</text><text x="1276" y="301" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Aprobado no es publicado: espera a</text><text x="1276" y="317" font-size="11" font-weight="400" fill="#475569" text-anchor="start">la fecha del calendario.</text><line x1="1276" y1="325" x2="1544" y2="325" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="341" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">publicados</text><text x="1544" y="341" font-size="12" font-weight="700" fill="#166534" text-anchor="end">32</text><rect x="1260" y="480" width="300" height="180" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="506" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Si la API falla, reintenta</text><text x="1276" y="531" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Un error de red no puede perder un</text><text x="1276" y="547" font-size="11" font-weight="400" fill="#475569" text-anchor="start">post aprobado. Se marca, se</text><text x="1276" y="563" font-size="11" font-weight="400" fill="#475569" text-anchor="start">reintenta y se avisa.</text><line x1="1276" y1="571" x2="1544" y2="571" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="587" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">necesitaron reintento</text><text x="1544" y="587" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">4</text><text x="1276" y="606" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">perdidos</text><text x="1544" y="606" font-size="12" font-weight="700" fill="#166534" text-anchor="end">0</text><rect x="1260" y="780" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="806" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Métricas 24 h después</text><text x="1276" y="831" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Alcance e interacción de cada post,</text><text x="1276" y="847" font-size="11" font-weight="400" fill="#475569" text-anchor="start">por red y por origen del texto.</text><line x1="1276" y1="855" x2="1544" y2="855" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="871" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">humano</text><text x="1544" y="871" font-size="12" font-weight="700" fill="#0891b2" text-anchor="end">5.30 %</text><text x="1276" y="890" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">plantillas</text><text x="1544" y="890" font-size="12" font-weight="700" fill="#0891b2" text-anchor="end">5.95 %</text><rect x="1640" y="220" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="232" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="246" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="274" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Horas que no se pierden</text><text x="1656" y="299" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Adaptar a mano cada pieza a cuatro</text><text x="1656" y="315" font-size="11" font-weight="400" fill="#475569" text-anchor="start">redes consumía la semana.</text><rect x="1640" y="460" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="472" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="486" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="514" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Nada sale sin revisar</text><text x="1656" y="539" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Trabajando con menores, esto no</text><text x="1656" y="555" font-size="11" font-weight="400" fill="#475569" text-anchor="start">es un detalle: es el requisito.</text><rect x="1640" y="700" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="712" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="726" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="754" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Se sabe qué funciona</text><text x="1656" y="779" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Y con qué texto. La siguiente</text><text x="1656" y="795" font-size="11" font-weight="400" fill="#475569" text-anchor="start">campaña parte de datos.</text><rect x="48" y="1090" width="1904" height="52" rx="12" fill="#e2e8f0"/><text x="70" y="1122" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">El paso que no se puede quitar es el del medio. Sin él esto sería un bot; con él es una herramienta que un equipo de comunicaciones puede usar sin miedo.</text></svg>